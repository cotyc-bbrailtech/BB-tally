name: Weekly Insights Email

on:
  schedule:
    # Every Monday at 13:00 UTC (~9am US Eastern). Change the cron to taste:
    # minute hour day-of-month month day-of-week (0 = Sunday)
    - cron: '0 13 * * 1'
  workflow_dispatch: {} # lets you trigger a test run manually from the Actions tab

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nodemailer
        run: npm install nodemailer --no-save

      - name: Send weekly insights email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node scripts/weekly-insights-email.mjs
